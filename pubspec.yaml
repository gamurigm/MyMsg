name: my_msg
description: "A Signal clone Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI and Styling
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0

  # Architecture and Dependency Injection
  get_it: ^8.0.0
  equatable: ^2.0.5

  # State Management
  flutter_bloc: ^8.1.6

  # Routing
  go_router: ^14.0.0

  # Networking (Backend con Go)
  web_socket_channel: ^3.0.0
  http: ^1.2.0

  # Local Storage
  sqflite: ^2.4.0
  path_provider: ^2.1.5

  # Media
  image_picker: ^1.1.0
  file_picker: ^8.0.0
  permission_handler: ^11.3.0

  # Utils
  intl: ^0.19.0
  uuid: ^4.4.0
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  # assets:
  #   - assets/images/
